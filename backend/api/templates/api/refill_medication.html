<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Refill Medication</title>
    <link rel="stylesheet" type="text/css" href="{% static 'api/style.css' %}">
</head>
<body>
    <h1>Refill {{ medication.name }}</h1>

    <form action="{% url 'api:refill_medication' medication.medication_id %}" method="post">
        {% csrf_token %}
        <label for="amount">Amount to Add:</label>
        <input type="number" id="amount" name="amount" min="1" value="30">
        <input type="submit" value="Refill" class="button">
    </form>

    <a href="{% url 'api:medications_list' %}" class="button">Back to Medications</a>
</body>
</html>
