<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Add Ad-Hoc Dose</title>
    <link rel="stylesheet" type="text/css" href="{% static 'api/style.css' %}">
</head>
<body>
    <h1>Add Ad-Hoc Dose</h1>

    <form method="post">
        {% csrf_token %}
        <label for="medication">Medication:</label>
        <select id="medication" name="medication_id">
            {% for med in medications %}
                <option value="{{ med.medication_id }}">{{ med.name }}</option>
            {% endfor %}
        </select>
        <br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" step="0.01" required>
        <br>
        <label for="strength">Strength:</label>
        <input type="text" id="strength" name="strength">
        <br>
        <button type="submit">Add Dose</button>
    </form>

    <br>
    <a href="{% url 'api:daily_doses' %}">Back to Daily Doses</a>
</body>
</html>
