<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Add Medication</title>
    <link rel="stylesheet" type="text/css" href="{% static 'api/style.css' %}">
</head>
<body>
    <h1>Add New Medication</h1>

    <form method="post">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="medication_type">Type:</label>
        <input type="text" id="medication_type" name="medication_type">
        <br>
        <label for="strength">Strength:</label>
        <input type="text" id="strength" name="strength">
        <br>
        <label for="condition_treated">Condition Treated:</label>
        <input type="text" id="condition_treated" name="condition_treated">
        <br>
        <label for="instructions">Instructions:</label>
        <textarea id="instructions" name="instructions"></textarea>
        <br>
        <label for="amount_left">Amount Left:</label>
        <input type="number" id="amount_left" name="amount_left" step="0.01" value="0">
        <br>
        <label for="refill_threshold">Refill Threshold:</label>
        <input type="number" id="refill_threshold" name="refill_threshold" step="0.01" value="0">
        <br>
        <button type="submit">Add Medication</button>
    </form>

    <br>
    <a href="{% url 'api:medications_list' %}">Back to Medications</a>
</body>
</html>
