<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Update Medication</title>
    <link rel="stylesheet" type="text/css" href="{% static 'api/style.css' %}">
</head>
<body>
    <h1>Update {{ medication.name }}</h1>

    <form method="post">
        {% csrf_token %}
        <label for="strength">Strength:</label>
        <input type="text" id="strength" name="strength" value="{{ medication.strength|default:'' }}">
        <br>
        <label for="condition_treated">Condition Treated:</label>
        <input type="text" id="condition_treated" name="condition_treated" value="{{ medication.condition_treated|default:'' }}">
        <br>
        <label for="instructions">Instructions:</label>
        <textarea id="instructions" name="instructions">{{ medication.instructions|default:'' }}</textarea>
        <br>
        <button type="submit">Update Medication</button>
    </form>

    <br>
    <a href="{% url 'api:medications_list' %}">Back to Medications</a>
</body>
</html>
